name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: true
        type: string
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # Step 4: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Install Android SDK components
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-34" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      # Step 6: Cache Gradle dependencies
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-

      # Step 7: Add SDL2 submodule
      - name: Add SDL2 submodule
        run: |
          git submodule add --depth 1 \
            https://github.com/libsdl-org/SDL \
            third_party/SDL2
          cd third_party/SDL2
          git fetch --tags
          git checkout SDL2-2.28.5
          cd ../..
          git -c user.email="ci@github" \
              -c user.name="CI" \
              commit -m "Add SDL2 submodule [skip ci]"

      # Step 8: Set version
      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="debug-${{ github.sha }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Step 9: Build APK
      - name: Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ inputs.build_type }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      # Step 10: Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-Mobile-${{ env.VERSION }}
          path: android/app/build/outputs/apk/
          retention-days: 7

      # Step 11: Create GitHub Release on tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
